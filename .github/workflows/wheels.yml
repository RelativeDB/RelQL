name: Wheels

# Builds the release distributions for the `relativedb` PyPI package: a pure
# sdist plus a pure py3-none-any wheel. Model execution lives in the
# separately released relational-transformers package; relativedb.rt wires
# it in.
#
# This workflow only PRODUCES and VERIFIES artifacts. Publishing to PyPI is
# release-libraries.yml's job; it consumes the artifact named below:
#
#   relativedb-dist
#
# It matches the glob `relativedb-*` and holds a flat set of files for
# dist/, so downstream can download-artifact with `pattern: relativedb-*` +
# `merge-multiple: true`.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    # Cheap by default: the build only runs when a maintainer adds the
    # `build-wheels` label (see the `if:` on the job).
    types: [labeled, synchronize, reopened]
  schedule:
    # Weekly drift check -- catches runner-image and toolchain changes
    # between releases, when there is time to fix them.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'build-wheels')
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: relativedb
            path: python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build ${{ matrix.path }}

      - name: Verify metadata
        run: python -m twine check --strict ${{ matrix.path }}/dist/*

      - name: Confirm the wheel is pure
        run: |
          ls ${{ matrix.path }}/dist
          ls ${{ matrix.path }}/dist | grep -q 'py3-none-any\.whl'

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}-dist
          path: ${{ matrix.path }}/dist/*
          if-no-files-found: error
