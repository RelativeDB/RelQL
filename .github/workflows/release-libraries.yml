name: Release libraries

# Publishes the relativedb Python distribution to PyPI.
#
# This workflow does NOT build wheels. The multi-architecture wheels and the
# sdist are built by .github/workflows/wheels.yml, which uploads them as run
# artifacts; this workflow downloads those artifacts, re-verifies them, and
# publishes. Building here as well would risk shipping a different binary
# from the one that was tested.
#
# Publishing is manual and gated, never automatic on a tag push:
#   1. run wheels.yml (or let it run on main) and note its run id
#   2. run this workflow with wheels_run_id set and publish unchecked
#      -> downloads, twine check, dry run. Nothing is uploaded.
#   3. re-run with publish checked -> the pypi environment requires whatever
#      reviewers are configured on it before the upload step starts.
#
# Credentials: none. Upload uses PyPI trusted publishing (OIDC), so there is
# no API token stored in this repository. The PyPI project `relativedb` must
# have a trusted publisher configured for this repo, this workflow filename,
# and the `pypi` environment. Same for TestPyPI if the dry run is used.
#
# Rust, Java and crates.io/Maven Central jobs used to live here. They pointed
# at rust/ and java/ directories that do not exist in this repository and have
# been removed.

on:
  workflow_dispatch:
    inputs:
      wheels_run_id:
        description: >-
          Run id of the wheels.yml run whose artifacts are to be published
          (the numeric id in that run's URL). Required: this workflow never
          builds wheels itself, so there is nothing sensible to default to.
        required: true
        type: string
      artifact_pattern:
        # Must match the artifact names wheels.yml uploads. As of writing it
        # produces exactly these four, all flat sets of files for dist/:
        #   relativedb-sdist
        #   relativedb-wheel-manylinux-x86_64
        #   relativedb-wheel-manylinux-aarch64
        #   relativedb-wheel-macos-universal2
        # If wheels.yml renames its artifacts, update this default to match.
        description: Artifact name pattern to download from that run
        required: false
        type: string
        default: "relativedb-*"
      test_pypi:
        description: Also upload to TestPyPI first (rehearsal)
        required: false
        type: boolean
        default: false
      publish:
        description: Publish the verified artifacts to PyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-libraries
  cancel-in-progress: false

jobs:
  verify:
    name: Collect and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read          # read artifacts from the wheels.yml run
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download the wheels.yml artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact_pattern }}
          merge-multiple: true
          path: dist
          run-id: ${{ inputs.wheels_run_id }}
          github-token: ${{ github.token }}

      - name: Check what arrived
        run: |
          set -euo pipefail
          find dist -type f | sort
          wheels=$(find dist -name '*.whl' | wc -l | tr -d ' ')
          sdists=$(find dist -name '*.tar.gz' | wc -l | tr -d ' ')
          echo "wheels=$wheels sdists=$sdists"
          # A release with no platform wheel would ship a package with no
          # engine in it, which is the exact failure mode of the old workflow.
          [ "$wheels" -ge 1 ] || { echo "no wheels found" >&2; exit 1; }
          [ "$sdists" -eq 1 ] || { echo "expected exactly one sdist" >&2; exit 1; }
          # Guard against the relationdb/relativedb naming slip: the PyPI
          # project is relativedb.
          if find dist -name 'relationdb*' | grep -q .; then
            echo "found relationdb-named artifacts; the project is relativedb" >&2
            exit 1
          fi

      - name: twine check
        run: |
          python -m pip install --upgrade twine
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: verified-distributions
          path: dist/
          if-no-files-found: error

  test-pypi:
    name: Rehearse on TestPyPI
    if: ${{ inputs.test_pypi }}
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: testpypi
      url: https://test.pypi.org/p/relativedb
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: verified-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A version already rehearsed on TestPyPI should not block a retry.
          skip-existing: true

  publish-python:
    name: Publish to PyPI
    if: ${{ inputs.publish }}
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/relativedb
    permissions:
      id-token: write        # trusted publishing; no stored API token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: verified-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
