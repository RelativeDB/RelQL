name: CI

# The test workflow. Runs on every push to main and every pull request.
#
# Lanes
#   unit         the fast Python tier, on all three supported architectures.
#                This is the PR gate.
#   integration  the tiers that need the rt-j checkpoint, with
#                RELATIVEDB_REQUIRE_NATIVE=1 so a missing checkpoint is a
#                FAILURE rather than a silent skip. Also the source of the
#                Python coverage report (it runs the whole suite, unit +
#                integration, so the number is not misleading).
#
# Platform support is Linux x86_64, Linux aarch64 and macOS arm64. Windows is
# deliberately out of scope.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR pushes are cancelled; main is not, so every commit on main
# keeps a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------------
  # Fast lane. The ubuntu-latest leg is the one PR authors wait on; it does
  # no model download and no network beyond pip. Running the full matrix here
  # is cheap; running the ~1 GB integration tier three times would not be,
  # hence the split.
  # ---------------------------------------------------------------------
  unit:
    name: Unit (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-x86_64
          # ubuntu-24.04-arm is a GitHub-hosted Arm64 label, generally
          # available and free for public repositories.
          - os: ubuntu-24.04-arm
            arch: linux-aarch64
          - os: macos-latest
            arch: macos-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install the Python package
        run: python -m pip install --upgrade "./python[dev]"

      - name: Python unit tier
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest python/tests -m "not integration" -q

  # ---------------------------------------------------------------------
  # Integration lane. Two legs, not three: x86_64 Linux is the deployment
  # target that gets the coverage upload, macOS arm64 is the second numeric
  # backend (MPS) and the one most likely to diverge. Linux aarch64 is
  # already covered by the unit tier above, so paying the ~1 GB checkpoint
  # download a third time buys very little.
  # ---------------------------------------------------------------------
  integration:
    name: Integration (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # codecov-action's use_oidc mints a token through ACTIONS_ID_TOKEN_-
    # REQUEST_URL, which the runner only exports when the job asks for
    # id-token: write. Without it the action throws before fail_ci_if_error
    # can swallow anything, so a green test run still reports a failed job.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-x86_64
            coverage: true
          - os: macos-latest
            arch: macos-arm64
            coverage: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      # The checkpoint set changes only when the pinned model revisions
      # change, so the key is a hand-bumped constant rather than a file hash:
      # hashing a lockfile would evict a ~570 MB cache on every unrelated
      # dependency bump. Bump the -v1 suffix to force a refetch.
      # The restore-keys prefix is shared with wheels.yml deliberately, so
      # either workflow can warm the other's cache.
      - name: Restore the Hugging Face cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ runner.arch }}-rtj-v1
          restore-keys: |
            hf-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the Python packages
        run: >-
          python -m pip install --upgrade "./python[dev]" "./python-engine"
          pytest-cov

      # Fetch explicitly rather than letting the first test that needs a
      # checkpoint pull it: a failure here reads as "download broke", not as
      # an inscrutable test error. Warm cache makes this a no-op.
      #
      # The sentence-transformers repos carry ONNX, OpenVINO, Rust and torch
      # copies of the same weights; taking a full snapshot of both would be
      # ~2.3 GB for ~225 MB of safetensors we actually load. Excluding them
      # takes the cold fetch from ~2.6 GB to ~570 MB.
      - name: Prefetch checkpoints
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download

          # ~342 MB: the two rt-j heads.
          snapshot_download("stanford-star/rt-j",
                            allow_patterns=["*.json", "classification/*",
                                            "regression/*"])

          # ~128 MB. all-MiniLM-L12-v2 only: it is DEFAULT_EMBEDDING_MODEL
          # (model.py) and the encoder the engine pins, so it is the one the
          # tests actually load. L6-v2 is merely an accepted alternative in
          # _EMBEDDING_DIMS and no test selects it -- fetching it too would
          # cost ~90 MB per cold run for nothing.
          snapshot_download("sentence-transformers/all-MiniLM-L12-v2",
                            ignore_patterns=[
                                "onnx/*", "openvino/*", "*.ot", "*.h5",
                                "*.msgpack", "pytorch_model.bin",
                                "tf_model.h5"])
          PY

      # RELATIVEDB_REQUIRE_NATIVE=1 turns "skipped, no checkpoint" into a
      # hard failure. Without it a fresh runner goes green having tested
      # nothing, which is the whole reason this lane exists.
      - name: Python integration tier
        if: ${{ !matrix.coverage }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          RELATIVEDB_REQUIRE_NATIVE: "1"
        run: python -m pytest python/tests -m integration -q

      # The coverage leg runs both tiers in one process. Measuring only the
      # integration tier (or only the unit tier) would report a number that
      # is wrong in an obvious direction.
      - name: Python suite with coverage
        if: ${{ matrix.coverage }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          RELATIVEDB_REQUIRE_NATIVE: "1"
        run: >-
          python -m pytest python/tests
          --cov=relativedb
          --cov-report=xml:coverage-python.xml
          --cov-report=term

      - name: Upload Python coverage to Codecov
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage-python.xml
          flags: python
          # Tokenless OIDC: public repositories do not need a stored upload
          # token. If this repository is private, or Codecov starts rejecting
          # tokenless uploads, add token: ${{ secrets.CODECOV_TOKEN }} here
          # and configure that secret in the repository settings.
          use_oidc: true
          fail_ci_if_error: false

  # Single required check for branch protection: the matrix legs change name
  # whenever the matrix does, this job's name does not.
  ci-ok:
    name: CI
    if: always()
    needs: [unit, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any lane failed
        run: |
          echo "unit=${{ needs.unit.result }}"
          echo "integration=${{ needs.integration.result }}"
          [ "${{ needs.unit.result }}" = success ] || exit 1
          [ "${{ needs.integration.result }}" = success ] || exit 1
