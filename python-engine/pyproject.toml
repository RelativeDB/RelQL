[build-system]
# >=77 for the PEP 639 SPDX `license` expression (see python/pyproject.toml).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relativedb-engine"
version = "0.1.3"
description = "RelativeDB inference engine over relational-transformers: Triton CUDA, torch MPS/CPU, MiniLM embedding, task-head fitting and full fine-tuning."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "relativedb contributors" }]
keywords = [
    "relational-transformer", "predictive-query", "relql",
    "foundation-model", "inference-engine",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
# The model runtime is the shared relational-transformers package; MiniLM
# text embedding runs in torch through transformers.
dependencies = [
    "relativedb==0.1.3",
    "relational-transformers>=0.1.0",
    "relational-transformers-utils>=0.1.0",
    "transformers>=4.40",
    "numpy>=1.24",
    "huggingface_hub>=0.23",
]

[project.scripts]
rt_triton_serve = "relativedb_engine.triton_server:main"
relativedb-quantize-fp8 = "relativedb_engine.quantization:main"

[project.urls]
Homepage = "https://relql.com"
Repository = "https://github.com/RelativeDB/RelQL"
Issues = "https://github.com/RelativeDB/RelQL/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=5"]
triton = [
    "triton>=3.7",
]
onnx = ["relational-transformers[onnx]>=0.1.0"]
# The flat-feature tree backend (relativedb_engine.xgb). XGBoost ships its own
# CUDA implementation; the backend selects device="cuda" when it is usable.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../python/src"]
addopts = "--strict-markers --strict-config"
markers = [
    "integration: needs a real model checkpoint; excluded from the unit tier",
    "checkpoint: needs an HF model checkpoint (rt-j and/or MiniLM)",
]
