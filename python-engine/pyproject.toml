[build-system]
# >=77 for the PEP 639 SPDX `license` expression (see python/pyproject.toml).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relativedb-engine"
version = "0.1.3"
description = "RelativeDB inference engine: Triton CUDA, native MPS/CPU and MiniLM, task-head fitting and full fine-tuning."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "relativedb contributors" }]
keywords = [
    "relational-transformer", "predictive-query", "relql",
    "foundation-model", "inference-engine",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
# Text embedding remains in librt_c. The model runtime is shared with the
# standalone relational-transformers package; its torch dependency is used
# only when that backend (or Triton CUDA) is selected.
dependencies = [
    "relativedb==0.1.3",
    "relational-transformers>=0.1.0",
    "numpy>=1.24",
    "huggingface_hub>=0.23",
]

[project.scripts]
rt_triton_serve = "relativedb_engine.triton_server:main"

[project.urls]
Homepage = "https://relql.com"
Repository = "https://github.com/RelativeDB/RelQL"
Issues = "https://github.com/RelativeDB/RelQL/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=5"]
triton = [
    "triton>=3.7",
]
onnx = ["relational-transformers[onnx]>=0.1.0"]
# The flat-feature tree backend (relativedb_engine.xgb). XGBoost ships its own
# CUDA implementation; the backend selects device="cuda" when it is usable.
xgboost = ["xgboost>=3.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

# The native engine (librt_c) is bundled into the wheel when present next to
# the package sources (see build_wheel.sh); native.py looks for it in-package
# first. setup.py tags the wheel platform-specific iff bundled; librt_c is
# loaded via ctypes so any CPython 3 works (py3-none-<platform>).
[tool.setuptools.package-data]
relativedb_engine = ["librt_c.dylib", "librt_c.so", "librt_c.dll", "rt_c.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../python/src"]
addopts = "--strict-markers --strict-config"
markers = [
    "integration: needs librt_c and/or a real model checkpoint; excluded from the unit tier",
    "native: needs librt_c (no checkpoint download)",
    "checkpoint: needs an HF model checkpoint (rt-j and/or MiniLM)",
]
