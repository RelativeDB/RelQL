AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: RelativeDB authenticated inference gateway

Parameters:
  DomainName:
    Type: String
    Default: api.relativedb.com
  HostedZoneId:
    Type: String
    Default: Z01767852AFYBPIJJWETG
  CloudMapNamespace:
    Type: String
    Default: workers.relativedb.local
  CloudMapService:
    Type: String
    Default: inference
  UpstreamTimeoutSeconds:
    Type: Number
    Default: 25
  EnableLandingBucket:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"

Conditions:
  LandingEnabled: !Equals [!Ref EnableLandingBucket, "true"]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 29
    Tracing: Active

Resources:
  Namespace:
    Type: AWS::ServiceDiscovery::HttpNamespace
    Properties:
      Name: !Ref CloudMapNamespace

  WorkerService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: !Ref CloudMapService
      NamespaceId: !GetAtt Namespace.Id
      HealthCheckCustomConfig:
        FailureThreshold: 1

  ApiKeys:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: key_hash
          AttributeType: S
      KeySchema:
        - AttributeName: key_hash
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  Usage:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  GatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      BinaryMediaTypes:
        - application/octet-stream
      EndpointConfiguration: REGIONAL
      TracingEnabled: true
      Domain:
        DomainName: !Ref DomainName
        CertificateArn: !Ref Certificate
        Route53:
          HostedZoneId: !Ref HostedZoneId
        EndpointConfiguration: REGIONAL

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  GatewayFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.handler
      Environment:
        Variables:
          CLOUDMAP_NAMESPACE: !Ref CloudMapNamespace
          CLOUDMAP_SERVICE: !Ref CloudMapService
          KEYS_TABLE: !Ref ApiKeys
          USAGE_TABLE: !Ref Usage
          UPSTREAM_TIMEOUT_SECONDS: !Ref UpstreamTimeoutSeconds
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ApiKeys
        - DynamoDBCrudPolicy:
            TableName: !Ref Usage
        - Statement:
            - Effect: Allow
              Action: servicediscovery:DiscoverInstances
              Resource: "*"
      Events:
        Proxy:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayApi
            Path: /{proxy+}
            Method: ANY

  LandingBucket:
    Type: AWS::S3::Bucket
    Condition: LandingEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

Outputs:
  GatewayUrl:
    Value: !Sub https://${DomainName}
  WorkerServiceId:
    Value: !GetAtt WorkerService.Id
  NamespaceId:
    Value: !GetAtt Namespace.Id
  ApiKeysTable:
    Value: !Ref ApiKeys
  UsageTable:
    Value: !Ref Usage
  LandingBucket:
    Condition: LandingEnabled
    Value: !Ref LandingBucket
