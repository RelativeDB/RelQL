app = "relativedb-gateway"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CLOUDMAP_NAMESPACE = "workers.relativedb.local"
  CLOUDMAP_SERVICE = "inference"
  DISCOVERY_CACHE_SECONDS = "5"
  MAX_BODY_BYTES = "6291456"
  UPSTREAM_TIMEOUT_SECONDS = "300"
  AWS_DEFAULT_REGION = "us-west-2"
  AWS_REGION = "us-west-2"
  AWS_ROLE_ARN = "arn:aws:iam::846199521923:role/relativedb-fly-gateway"
  KEYS_TABLE = "relativedb-gateway-api-keys"
  USAGE_TABLE = "relativedb-gateway-usage"
  OPENAI_BASE_URL = "https://api.openai.com"
  OPENAI_ALLOWED_MODELS = "gpt-5.6-sol,gpt-5.6-terra,gpt-5.6-luna"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 100
    hard_limit = 150

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/gateway/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
